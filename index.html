<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>sw_game_hub</title>
    <style>
        body { 
            background-color: #1a1a1a; 
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            margin: 0;
            padding: 50px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        /* 프로필 섹션 스타일 */
        .profile-card {
            background: #2a2a2a;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #4CAF50;
            margin-bottom: 15px;
        }
        .profile-card h2 {
            margin: 10px 0;
            color: #4CAF50;
        }
        .profile-card p {
            color: #b0b0b0;
            line-height: 1.6;
        }
        /* 게임 목록 섹션 스타일 */
        .games-section h2 {
            margin-bottom: 25px;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            display: inline-block;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .game-card { 
            background: #2a2a2a; 
            border-radius: 12px; 
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .game-card:hover {
            transform: translateY(-5px);
        }
        .game-thumbnail {
            width: 100%;
            height: 140px;
            object-fit: cover;
            background-color: #444;
        }
        .game-info {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .game-info h3 {
            margin: 0 0 10px 0;
            font-size: 18px;
        }
        .game-btn { 
            display: block;
            background: #333; 
            color: #ffffff;
            padding: 10px; 
            border: 2px solid #4CAF50;
            border-radius: 8px; 
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
            margin-top: 10px;
        }
        .game-btn:hover {
            background: #4CAF50;
            color: #1a1a1a;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-card">
            <img src="https://cdn.pixabay.com/photo/2017/08/05/12/58/computer-2583383_1280.jpg" alt="프로필 이미지" class="profile-img">
            <h2>개발자 소개</h2>
            <p>안녕하세요! 재미있는 게임을 기획하고 만드는 중학생 자작 게임 개발자입니다.<br>다양한 게임들을 즐겨보세요.</p>
        </div>

        <div class="games-section">
            <h2>🎮 자작 게임 바로가기</h2>
            
            <div class="game-grid">
                <div class="game-card">
                    <img src="https://cdn.pixabay.com/photo/2016/04/30/16/25/games-1363218_1280.jpg" alt="복권게임 썸네일" class="game-thumbnail">
                    <div class="game-info">
                        <h3>복권게임</h3>
                        <a href="https://pull-taps.vercel.app/" class="game-btn" target="_blank">플레이하기</a>
                    </div>
                </div>

                <div class="game-card">
                    <img src="https://cdn.pixabay.com/photo/2016/12/13/22/15/chart-1905225_1280.jpg" alt="주식게임 썸네일" class="game-thumbnail">
                    <div class="game-info">
                        <h3>주식게임</h3>
                        <a href="https://stock-game-olive.vercel.app/" class="game-btn" target="_blank">플레이하기</a>
                    </div>
                </div>

                <div class="game-card">
                    <img src="https://images.pexels.com/photos/9859351/pexels-photo-9859351.jpeg" alt="카드게임 썸네일" class="game-thumbnail">
                    <div class="game-info">
                        <h3>카드게임 (블랙잭)</h3>
                        <a href="https://black-jack-rouge.vercel.app/" class="game-btn" target="_blank">플레이하기</a>
                    </div>
                </div>
                                <div class="game-card">
                    <img src="https://images.pexels.com/photos/6075494/pexels-photo-6075494.jpeg" alt="주식게임 썸네일" class="game-thumbnail">
                    <div class="game-info">
                        <h3>속도 게임</h3>
                        <a href="https://speed-game-five.vercel.app/" class="game-btn" target="_blank">플레이하기</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
